name: Moon image

# Renders GPSTest/Resources/Assets.xcassets/Moon.imageset from NASA's LRO map and commits it.
on:
  push:
    paths:
      - "tools/make_moon_image.py"
      - ".github/workflows/moon-image.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow numpy
      - run: python3 tools/make_moon_image.py
      - name: Commit the image if it changed
        run: |
          git add GPSTest/Resources/Assets.xcassets/Moon.imageset
          if git diff --cached --quiet; then echo "Unchanged."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Moon image rendered from NASA LRO colour map"
          git push
